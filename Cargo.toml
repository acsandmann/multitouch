[package]
name = "multitouch"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Raw macOS multitouch, gesture recognition, device monitoring, and Force Touch haptics"
license = "Apache-2.0"
keywords = ["macos", "multitouch", "trackpad", "gestures", "haptics"]
categories = ["api-bindings", "os::macos-apis"]
build = "build.rs"

[lib]
name = "multitouch"
path = "src/lib.rs"

[features]
default = []

[dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFString"] }

[dev-dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[package.metadata.docs.rs]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
